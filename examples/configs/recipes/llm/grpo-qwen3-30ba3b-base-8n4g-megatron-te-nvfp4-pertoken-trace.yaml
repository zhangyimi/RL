defaults: grpo-qwen3-30ba3b-base-8n4g-megatron-te-nvfp4-pertoken.yaml
# TRACE (arXiv 2610.07767) with QAT: the routed experts train in BF16 on NVFP4
# fake-quantized weights and activations; on the latter half of the MoE layers
# the fc1/fc2 input fake quantization follows the rollout's codes (mantissa
# bit) and scales. Requires router replay and vLLM TP=1.
grpo:
  max_num_steps: 1500
  val_period: 20
policy:
  megatron_cfg:
    first_last_layers_bf16: false
    te_precision_config_file: examples/te_precision/all_bf16_trace_qat.yaml
  generation:
    nvfp4_pertoken_rollout:
      trace:
        enabled: true
    vllm_kwargs:
      # Router replay on the pinned vLLM nightly needs synchronous scheduling
      # (same as the Nemotron 3.5 recipe).
      async_scheduling: false
      # Caps the KV block pool (peak use is ~10%) and with it the host-side
      # routed-experts store.
      num_gpu_blocks_override: 16000
checkpointing:
  save_period: 20
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-megatron-te-nvfp4-pertoken-trace
logger:
  log_dir: logs/grpo-qwen3-30ba3b-base-8n4g-megatron-te-nvfp4-pertoken-trace
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-megatron-te-nvfp4-pertoken-trace
