defaults: grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken.yaml
# TRACE (arXiv 2610.07767) with QAT: the routed experts train in BF16 on NVFP4
# fake-quantized weights and activations; on the latter half of the MoE layers
# the fc1/fc2 input fake quantization follows the rollout's codes (mantissa
# bit) and scales. Requires router replay and vLLM TP=1.
policy:
  megatron_cfg:
    te_precision_config_file: examples/te_precision/all_bf16_trace_qat.yaml
  generation:
    nvfp4_pertoken_rollout:
      trace:
        enabled: true
checkpointing:
  checkpoint_dir: results/grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken-trace
logger:
  log_dir: logs/grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken-trace
  wandb:
    name: grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken-trace
